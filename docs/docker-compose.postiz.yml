# ==============================================================================
# Postiz Standalone Production Docker Compose
# Architecture: Independent microservices stack (Next.js App + Worker + Redis + Postgres)
# Minimum System Requirements: 2 Cores, 2 GB RAM (4 GB RAM Recommended)
# Note: Do NOT attempt to run this on a 1 GB VPS or inside Netlify serverless functions.
# ==============================================================================
version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Postiz Web & API Server
  # ----------------------------------------------------------------------------
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz-app
    restart: always
    environment:
      - MAIN_URL=https://postiz.yourdomain.com
      - FRONTEND_URL=https://postiz.yourdomain.com
      - NEXT_PUBLIC_BACKEND_URL=https://postiz.yourdomain.com/api
      - JWT_SECRET=generate_a_secure_jwt_secret_with_openssl_rand_hex_32
      - DATABASE_URL=postgresql://postiz_user:postiz_secure_password_123@postiz-db:5432/postiz?schema=public
      - REDIS_URL=redis://postiz-redis:6379
      - BACKEND_INTERNAL_URL=http://localhost:3000
      - IS_GENERAL=true
      - STORAGE_PROVIDER=local
      - UPLOAD_DIRECTORY=/uploads
      - WEBHOOK_SECRET=your_postiz_webhook_signing_secret_here
    volumes:
      - postiz_uploads:/uploads
    ports:
      - "4200:3000"
    depends_on:
      - postiz-db
      - postiz-redis

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & Job Queue (BullMQ)
  # ----------------------------------------------------------------------------
  postiz-redis:
    image: redis:7-alpine
    container_name: postiz-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - postiz_redis_data:/data

  # ----------------------------------------------------------------------------
  # 3. PostgreSQL Database (Dedicated for Postiz internal state)
  # ----------------------------------------------------------------------------
  postiz-db:
    image: postgres:15-alpine
    container_name: postiz-db
    restart: always
    environment:
      - POSTGRES_USER=postiz_user
      - POSTGRES_PASSWORD=postiz_secure_password_123
      - POSTGRES_DB=postiz
    volumes:
      - postiz_db_data:/var/lib/postgresql/data

volumes:
  postiz_uploads:
  postiz_redis_data:
  postiz_db_data:
